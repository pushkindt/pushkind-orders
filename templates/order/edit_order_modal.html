<form id="editOrderForm" action="/orders/{{ order.id }}/edit" method="POST">
    <div class="modal-header">
        <h1 class="modal-title fs-5" id="editOrderModalLabel">Редактировать заказ</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
    </div>
    <div class="modal-body" style="max-height: calc(100vh - 200px); overflow-y: auto;">
        <input type="hidden" id="editOrderId" name="order_id" value="{{ order.id }}">
        <div class="row g-3">
            <div class="col-md-6">
                <label for="editOrderStatus" class="form-label">Статус</label>
                <select class="form-select" id="editOrderStatus" name="status" required>
                    <option value="Draft" {% if order.status == "Draft" %}selected{% endif %}>Черновик</option>
                    <option value="Pending" {% if order.status == "Pending" %}selected{% endif %}>Ожидает</option>
                    <option value="Processing" {% if order.status == "Processing" %}selected{% endif %}>В обработке</option>
                    <option value="Completed" {% if order.status == "Completed" %}selected{% endif %}>Завершён</option>
                    <option value="Cancelled" {% if order.status == "Cancelled" %}selected{% endif %}>Отменён</option>
                </select>
            </div>
            <div class="col-md-6">
                <label for="editOrderReference" class="form-label">Внешний номер</label>
                <input type="text"
                       class="form-control"
                       id="editOrderReference"
                       name="reference"
                       value="{{ order.reference | default(value='') }}"
                       maxlength="128"
                       placeholder="Номер из 1С, договора и т.д.">
            </div>
        </div>

        <div class="mb-3 mt-3">
            <label for="editOrderNotes" class="form-label">Заметки</label>
            <textarea class="form-control"
                      id="editOrderNotes"
                      name="notes"
                      rows="3"
                      placeholder="Обновите внутренние заметки по заказу">{{ order.notes | default(value='') }}</textarea>
        </div>

        <div class="row g-3 mt-3">
            <div class="col-md-6">
                <label for="editOrderShippingAddress" class="form-label">Адрес доставки</label>
                <textarea class="form-control"
                          id="editOrderShippingAddress"
                          name="shipping_address"
                          rows="2"
                          placeholder="Город, улица, дом/офис">{{ order.shipping_address | default(value='') }}</textarea>
            </div>
            <div class="col-md-6">
                <label for="editOrderConsignee" class="form-label">Получатель</label>
                <input type="text"
                       class="form-control"
                       id="editOrderConsignee"
                       name="consignee"
                       value="{{ order.consignee | default(value='') }}"
                       maxlength="128"
                       placeholder="Имя получателя">
            </div>
            <div class="col-md-6">
                <label for="editOrderDeliveryNotes" class="form-label">Инструкции по доставке</label>
                <textarea class="form-control"
                          id="editOrderDeliveryNotes"
                          name="delivery_notes"
                          rows="2"
                          placeholder="Уточнение времени или точки вручения">{{ order.delivery_notes | default(value='') }}</textarea>
            </div>
            <div class="col-md-6">
                <label for="editOrderPayer" class="form-label">Плательщик</label>
                <input type="text"
                       class="form-control"
                       id="editOrderPayer"
                       name="payer"
                       value="{{ order.payer | default(value='') }}"
                       maxlength="128"
                       placeholder="Название компании или физлица">
            </div>
        </div>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
        <button type="submit" class="btn btn-primary">Сохранить</button>
    </div>
</form>
