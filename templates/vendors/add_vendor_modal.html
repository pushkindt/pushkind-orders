<div class="modal fade" id="addVendorModal" tabindex="-1" aria-labelledby="addVendorModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="addVendorModalLabel">Добавить поставщика</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form action="/vendors/add" method="POST">
                    <div class="row mb-3">
                        <label for="vendorName" class="col-md-3 col-form-label">Название</label>
                        <div class="col-md-9">
                            <input name="name" type="text" class="form-control" id="vendorName"
                                   placeholder="Например: «Кофейня»" maxlength="128" required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <button class="btn btn-primary" type="submit">Сохранить</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
