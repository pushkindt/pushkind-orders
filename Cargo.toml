[package]
name = "pushkind-orders"
version = "0.1.0"
edition = "2024"
default-run = "pushkind-orders"

[dependencies]
thiserror = "2.0.18"
actix-files = "0.6.10"
actix-identity = "0.9.0"
actix-multipart = "0.7.2"
actix-session = { version = "0.11.0", features = ["cookie-session"] }
actix-web = "4.13.0"
chrono = { version = "0.4.44", features = ["serde"] }
csv = "1.4.0"
diesel = { version = "2.3.7", features = [
    "sqlite",
    "r2d2",
    "chrono",
    "returning_clauses_for_sqlite_3_35",
] }
dotenvy = "0.15.7"
env_logger = "0.11.9"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
pushkind-common = { git = "https://github.com/pushkindt/pushkind-common.git", branch = "main", features = [
    "db",
    "actix",
], default-features = false }
validator = { version = "0.20.0", features = ["derive"] }
actix-cors = "0.7.1"
serde_qs = { version = "1.0.0" }
phonenumber = "0.3"
rand = "0.10.1"
ammonia = "4.1.2"
config = { version = "0.15.22", default-features = false, features = ["yaml"] }
pushkind-crm = { git = "https://github.com/pushkindt/pushkind-crm.git", version = "0.1.0", features = [
    "data",
], default-features = false }
serde_html_form = { version = "0.4.0" }
jsonwebtoken = "10.3.0"

[dev-dependencies]
diesel_migrations = "2.3.1"
mockall = "0.14.0"
actix-rt = "2.11.0"
tempfile = "3.27.0"
