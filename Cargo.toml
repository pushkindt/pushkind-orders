[package]
name = "pushkind-orders"
version = "0.1.0"
edition = "2024"
default-run = "pushkind-orders"

[dependencies]
thiserror = "2.0.17"
actix-files = "0.6.9"
actix-identity = "0.9.0"
actix-multipart = "0.7.2"
actix-session = { version = "0.11.0", features = ["cookie-session"] }
actix-web = "4.12.1"
actix-web-flash-messages = { version = "0.5.0", features = ["cookies"] }
chrono = { version = "0.4.41", features = ["serde"] }
csv = "1.4.0"
diesel = { version = "2.3.4", features = [
    "sqlite",
    "r2d2",
    "chrono",
    "returning_clauses_for_sqlite_3_35",
] }
dotenvy = "0.15.7"
env_logger = "0.11.8"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.143"
tera = { version = "1.20.1", features = ["builtins"] }
pushkind-common = { git = "https://github.com/pushkindt/pushkind-common.git", branch = "main", features = [
    "db",
    "actix",
    "sms",
    "zeromq",
], version = "0.1.0" }
validator = { version = "0.20.0", features = ["derive"] }
actix-cors = "0.7.1"
serde_qs = { version = "0.15.0" }
phonenumber = "0.3"
rand = "0.9.2"
ammonia = "4.1.2"
config = { version = "0.15.19", default-features = false, features = ["yaml"] }

[dev-dependencies]
diesel_migrations = "2.3.1"
mockall = "0.14.0"
actix-rt = "2.11.0"
tempfile = "3.13.0"
